<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0e27" />
  <meta name="description" content="AquaSense — Real-time water quality and satellite intelligence monitoring system" />

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json" />

  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AquaSense" />

  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Google Fonts: Space Grotesk (brutalist headings) + Inter (clean body) -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <title>AquaSense — Water Intelligence</title>
</head>

<body>
  <div id="root">
    <!-- Light theme loading screen -->
    <div
      style="height: 100vh; display: flex; align-items: center; justify-content: center; background: #f0f4f8; color: #3b82f6; font-family: 'Space Grotesk', sans-serif; flex-direction: column; gap: 0.75rem;">
      <h2 style="font-size: 2rem; font-weight: 700; letter-spacing: -0.03em;">💧 AquaSense</h2>
      <p style="color: #64748b; font-family: 'Inter', sans-serif; font-size: 0.9rem;">Initializing System...</p>
      <div style="width: 120px; height: 3px; border-radius: 99px; background: rgba(59,130,246,0.15); overflow: hidden; margin-top: 0.5rem;">
        <div style="width: 40%; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #3b82f6, #06b6d4); animation: loadSlide 1.5s ease-in-out infinite alternate;"></div>
      </div>
    </div>
    <style>
      @keyframes loadSlide { from { transform: translateX(0); } to { transform: translateX(150%); } }
    </style>
  </div>
  <script type="module" src="src/main.jsx"></script>
</body>

</html>
