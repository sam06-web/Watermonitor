services:
  - type: web
    name: aquasense-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: aquasense
      - key: CORS_ORIGIN
        sync: false
      - key: NASA_EARTHDATA_TOKEN
        sync: false
      - key: NASA_EARTHDATA_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
